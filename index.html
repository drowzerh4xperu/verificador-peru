<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificador Perú</title>

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
  margin:0;
  background:linear-gradient(180deg,#050b1f,#020617);
  color:#fff;
  min-height:100vh;
}
.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  margin-bottom:20px;
}
.tabs{
  display:flex;
  gap:10px;
}
.tab{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#1e293b;
  color:#fff;
  font-weight:bold;
}
.tab.active{
  background:#2563eb;
}
.card{
  margin-top:20px;
  background:#020617;
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 20px rgba(0,0,0,.5);
}
label{font-size:14px}
input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  margin-top:6px;
  font-size:16px;
}
button.action{
  margin-top:15px;
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:bold;
  background:#22c55e;
}
.result{
  margin-top:15px;
  font-size:15px;
}
.logos{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:15px;
}
.logos img{
  width:120px;
  opacity:.9;
}
.footer{
  margin-top:25px;
  font-size:12px;
  text-align:center;
  opacity:.7;
}

/* WhatsApp flotante */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
}
.whatsapp img{
  width:100%;
}
</style>
</head>

<body>
<div class="container">
<h1>🔍 Verificador Perú</h1>

<div class="tabs">
  <button id="tabCel" class="tab active" onclick="showCel()">OSIPTEL Celular</button>
  <button id="tabDni" class="tab" onclick="showDni()">RENIEC DNI</button>
</div>

<div class="card" id="celular">
  <label>Número de celular (Perú)</label>
  <input id="phone" placeholder="Ej: 987654321">
  <button class="action" onclick="verificarCel()">Verificar Celular</button>
</div>

<div class="card" id="dni" style="display:none">
  <label>DNI (8 dígitos)</label>
  <input id="dniInput" placeholder="Ej: 12345678">
  <button class="action" onclick="verificarDni()">Verificar DNI</button>
</div>

<div class="result" id="resultado"></div>

<div class="logos">
  <img src="assets/osiptel.png">
  <img src="assets/reniec.png">
</div>

<div class="footer">
Demo educativo · No consulta bases oficiales · No almacena datos<br>
<a href="https://www.osiptel.gob.pe" target="_blank">OSIPTEL oficial</a> |
<a href="https://www.reniec.gob.pe" target="_blank">RENIEC oficial</a>
</div>
</div>

<a class="whatsapp" href="https://wa.me/519XXXXXXXX" target="_blank">
  <img src="assets/whatsapp.png">
</a>

<script>
const tabCel=document.getElementById("tabCel");
const tabDni=document.getElementById("tabDni");
const celular=document.getElementById("celular");
const dni=document.getElementById("dni");
const resultado=document.getElementById("resultado");

function showCel(){
 tabCel.classList.add("active");
 tabDni.classList.remove("active");
 celular.style.display="block";
 dni.style.display="none";
 resultado.innerHTML="";
}

function showDni(){
 tabDni.classList.add("active");
 tabCel.classList.remove("active");
 dni.style.display="block";
 celular.style.display="none";
 resultado.innerHTML="";
}

function verificarCel(){
 const n=document.getElementById("phone").value.trim();
 if(!/^9\d{8}$/.test(n)){
   resultado.innerHTML="❌ Número inválido";
   return;
 }
 resultado.innerHTML="✅ Número válido<br>📌 Consulta disponible en OSIPTEL";
}

function verificarDni(){
 const d=document.getElementById("dniInput").value.trim();
 if(!/^\d{8}$/.test(d)){
   resultado.innerHTML="❌ DNI inválido";
   return;
 }
 resultado.innerHTML="✅ DNI válido<br>📌 Consulta disponible en RENIEC";
}
</script>
</body>
  </html>
