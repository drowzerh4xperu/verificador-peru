<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🔎 Verificador Perú</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#050b1a,#0a1a3a);
  display:flex;
  justify-content:center;
  padding:20px;
  color:#fff;
}

/* CONTENEDOR */
.container{
  width:100%;
  max-width:420px;
  animation:fadeIn 0.8s ease;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}

/* TITULO */
h1{
  text-align:center;
  margin-bottom:15px;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tabs button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#1b2c5a;
  color:#fff;
  font-weight:bold;
}

.tabs button.active{
  background:#2979ff;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-size:16px;
}

/* BOTONES */
.btn{
  width:100%;
  margin-top:15px;
  padding:12px;
  background:#2979ff;
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

/* RESULTADO */
.result{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:rgba(0,0,0,.3);
}

/* PAGOS */
.payments{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.payments img{
  width:100%;
  border-radius:12px;
}

/* LINKS */
.link{
  display:block;
  margin-top:12px;
  text-align:center;
  color:#4fc3f7;
  text-decoration:none;
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:12px;
  margin-top:15px;
  opacity:.7;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25d366;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#fff;
  text-decoration:none;
}

/* ANIMACION */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>🔎 Verificador Perú</h1>

    <div class="tabs">
      <button id="tabCel" class="active" onclick="showCel()">OSIPTEL Celular</button>
      <button id="tabDni" onclick="showDni()">RENIEC DNI</button>
    </div>

    <!-- CELULAR -->
    <div id="celular">
      <label>Número de celular (Perú)</label>
      <input id="phone" placeholder="Ej: 987654321">
      <button class="btn" onclick="verificarCel()">Verificar Celular</button>
    </div>

    <!-- DNI -->
    <div id="dni" style="display:none">
      <label>DNI</label>
      <input id="dniInput" placeholder="Ej: 12345678">
      <button class="btn" onclick="verificarDni()">Verificar DNI</button>
    </div>

    <div id="resultado" class="result"></div>
    
    <a class="link" href="https://checatuslineas.osiptel.gob.pe/" target="_blank">
      🔗 Consultar OSIPTEL oficial
    </a>

    <a class="link" href="https://www.reniec.gob.pe/" target="_blank">
      🔗 Consultar RENIEC oficial
    </a>

    <div class="footer">
      Demo educativo · No consulta bases oficiales · No almacena datos
    </div>

  </div>
</div>

<a class="whatsapp"
href="https://wa.me/51907594198?text=Hola%20quiero%20información%20del%20Verificador%20Perú"
target="_blank">💬</a>

<script>
function showCel(){
  tabCel.classList.add("active");
  tabDni.classList.remove("active");
  celular.style.display="block";
  dni.style.display="none";
  resultado.innerHTML="";
}

function showDni(){
  tabDni.classList.add("active");
  tabCel.classList.remove("active");
  dni.style.display="block";
  celular.style.display="none";
  resultado.innerHTML="";
}
function verificarCel(){
  const n = phone.value.trim();
  if(!/^9\d{8}$/.test(n)){
    resultado.innerHTML = "❌ Número inválido";
    return;
  }
  resultado.innerHTML = "✅ Número válido<br>📱 Perú<br><small>Demo educativo</small>";
}

function verificarDni(){
  const d = dniInput.value.trim();
  if(!/^\d{8}$/.test(d)){
    resultado.innerHTML = "❌ DNI inválido";
    return;
  }
  resultado.innerHTML = "✅ DNI válido<br>🪪 RENIEC<br><small>Demo educativo</small>";
}
</script>

</body>
</html>
